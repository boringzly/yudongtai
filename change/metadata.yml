id: "change_detection"
version: "1.0"
name: "变化检测"
conda_env: "clbase_1"
entry: "main.py"
author: "cd_seg"
email: ""

parameters:
  - id: "pre_image"
    name: "前时相影像路径"
    type: "str"
    required: true
    default: null
    position: "input"

  - id: "post_image"
    name: "后时相影像路径"
    type: "str"
    required: true
    default: null
    position: "input"

  - id: "model_path"
    name: "主模型权重路径"
    type: "str"
    required: false
    default: "./FBCD_test_select0207_best_acc.pth"
    position: "input"

  - id: "use_two_models"
    name: "是否使用双模型融合"
    type: "bool"
    required: false
    default: false
    position: "input"

  - id: "second_model_path"
    name: "第二模型权重路径"
    type: "str"
    required: false
    default: "./FBCD_test_Levir_CD_best_acc.pth"
    position: "input"

  - id: "dst_path"
    name: "输出目录路径"
    type: "str"
    required: true
    default: null
    position: "output"
    runtime_input: true

  - id: "resume_from"
    name: "续跑源任务ID或绝对目录"
    type: "str"
    required: false
    default: ""
    position: "input"

  - id: "resume_allow_legacy"
    name: "允许导入旧版完成日志（需确认输入模型未变）"
    type: "bool"
    required: false
    default: false
    position: "input"

  - id: "output_dataset"
    name: "输出数据集目录"
    type: "str"
    required: false
    default: null
    position: "archieve"

  - id: "kafka_server_ip_port"
    name: "kafka服务器IP和端口"
    type: "str"
    required: false
    default: null
    position: "running"

  - id: "kafka_topic"
    name: "kafka消息主题"
    type: "str"
    required: false
    default: null
    position: "running"

  - id: "kafka_task_id"
    name: "kafka任务ID"
    type: "str"
    required: false
    default: null
    position: "running"
